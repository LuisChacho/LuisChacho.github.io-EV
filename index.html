<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Virtual EVA - Sistema de Aprendizaje</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="app-body" class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Superior -->
  <header id="app-header" class="bg-indigo-900 text-white shadow-md py-3.5 px-6 flex justify-between items-center sticky top-0 z-50 transition-colors duration-300">
    <div class="flex items-center gap-3">
      <div id="app-logo-bg" class="bg-indigo-700 p-2 rounded-lg text-indigo-200 transition-colors">
        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
      </div>
      <div>
        <span class="text-xl font-bold tracking-wide block leading-none">Campus Virtual EVA</span>
        <span id="app-header-sub" class="text-xs text-indigo-300">Plataforma de Aprendizaje y Gestión Académica</span>
      </div>
    </div>
    
    <!-- Selector de Rol -->
    <div class="flex items-center gap-4 text-sm font-medium">
      <div id="role-selector-container" class="bg-indigo-800/80 p-1 rounded-lg border border-indigo-700 flex text-xs">
        <button id="btn-role-student" onclick="switchRole('estudiante')" class="px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow">
          Vista Estudiante
        </button>
        <button id="btn-role-teacher" onclick="switchRole('docente')" class="px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white flex items-center gap-1">
          <i data-lucide="lock" class="w-3 h-3"></i> Vista Docente
        </button>
      </div>
      <div id="user-avatar-container" class="hidden md:flex items-center gap-2 border-l border-indigo-700 pl-4">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs" id="user-avatar">
          E
        </div>
        <span id="user-name-display" class="text-sm">Estudiante</span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main id="main-content" class="flex-1 p-6 max-w-7xl mx-auto w-full">
    <!-- Carga dinámica -->
  </main>

  <!-- Modal Visor de PDF -->
  <div id="pdf-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex-col justify-center items-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden border border-slate-300">
      <div id="pdf-modal-header" class="bg-indigo-900 text-white px-5 py-3 flex justify-between items-center transition-colors">
        <div class="flex items-center gap-2">
          <i data-lucide="file-text" class="w-5 h-5 text-indigo-300"></i>
          <div>
            <h3 id="pdf-modal-title" class="font-bold text-sm leading-none">Vista Previa del Documento PDF</h3>
            <span id="pdf-modal-subtitle" class="text-xs text-indigo-200">Revisión de Tarea del Estudiante</span>
          </div>
        </div>
        <button onclick="closePdfModal()" class="text-indigo-200 hover:text-white p-1.5 rounded-lg transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="flex-1 bg-slate-200 p-2 relative flex flex-col justify-center items-center">
        <iframe id="pdf-frame" class="w-full h-full rounded-lg border border-slate-300 shadow-inner bg-white" src="about:blank"></iframe>
      </div>
      <div class="bg-slate-50 border-t border-slate-200 p-3 flex justify-between items-center text-xs">
        <span class="text-slate-500 font-medium flex items-center gap-1">
          <i data-lucide="info" class="w-4 h-4 text-indigo-600"></i> Si el navegador no despliega la vista previa integrada, se habilitará la opción de descarga.
        </span>
        <button onclick="closePdfModal()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-lg transition-colors">
          Cerrar Visor
        </button>
      </div>
    </div>
  </div>

  <script>
    // Canal de sincronización en tiempo real para múltiples pestañas/dispositivos
    const syncChannel = new BroadcastChannel('eva_sync_channel');

    // Paletas de Color Configurables
    const themePalettes = {
      indigo: {
        headerBg: 'bg-indigo-900',
        headerSub: 'text-indigo-300',
        logoBg: 'bg-indigo-700',
        accentBg: 'bg-indigo-600',
        accentHover: 'hover:bg-indigo-700',
        accentText: 'text-indigo-600',
        accentLightBg: 'bg-indigo-50',
        borderAccent: 'border-indigo-200'
      },
      emerald: {
        headerBg: 'bg-emerald-900',
        headerSub: 'text-emerald-300',
        logoBg: 'bg-emerald-700',
        accentBg: 'bg-emerald-600',
        accentHover: 'hover:bg-emerald-700',
        accentText: 'text-emerald-600',
        accentLightBg: 'bg-emerald-50',
        borderAccent: 'border-emerald-200'
      },
      violet: {
        headerBg: 'bg-violet-900',
        headerSub: 'text-violet-300',
        logoBg: 'bg-violet-700',
        accentBg: 'bg-violet-600',
        accentHover: 'hover:bg-violet-700',
        accentText: 'text-violet-600',
        accentLightBg: 'bg-violet-50',
        borderAccent: 'border-violet-200'
      },
      cobalt: {
        headerBg: 'bg-slate-900',
        headerSub: 'text-cyan-400',
        logoBg: 'bg-cyan-700',
        accentBg: 'bg-cyan-600',
        accentHover: 'hover:bg-cyan-700',
        accentText: 'text-cyan-600',
        accentLightBg: 'bg-cyan-50',
        borderAccent: 'border-cyan-200'
      }
    };

    let currentTheme = localStorage.getItem('eva_theme_color') || 'indigo';
    let currentRole = 'estudiante'; 
    let adminPassword = localStorage.getItem('eva_admin_password') || "Luis0316"; 
    
    // Cursos predeterminados
    const defaultCursos = [
      { id: 'mat3', nombre: 'Matemática Superior', asignatura: 'Matemática', nivel: '3º BGU - Paralelo A', clave: 'MAT2026' },
      { id: 'fis2', nombre: 'Física General', asignatura: 'Física', nivel: '2º BGU - Paralelo B', clave: 'FIS2026' },
      { id: 'rob_2egb', nombre: 'Robótica Inicial - Mecanismos Básicos', asignatura: 'Robótica', nivel: '2º EGB', clave: 'ROB2EGB' },
      { id: 'rob_3egb', nombre: 'Robótica Educativa - Engranajes y Palancas', asignatura: 'Robótica', nivel: '3º EGB', clave: 'ROB3EGB' },
      { id: 'rob_4egb', nombre: 'Robótica Educativa - Circuitos Básicos', asignatura: 'Robótica', nivel: '4º EGB', clave: 'ROB4EGB' },
      { id: 'rob_5egb', nombre: 'Robótica y Autómatas I', asignatura: 'Robótica', nivel: '5º EGB', clave: 'ROB5EGB' },
      { id: 'rob_6egb', nombre: 'Robótica y Sensórica I', asignatura: 'Robótica', nivel: '6º EGB', clave: 'ROB6EGB' },
      { id: 'rob_7egb', nombre: 'Robótica y Sensórica II', asignatura: 'Robótica', nivel: '7º EGB', clave: 'ROB7EGB' },
      { id: 'rob_8egb', nombre: 'Programación de Bloques y Algoritmos', asignatura: 'Robótica', nivel: '8º EGB', clave: 'ROB8EGB' },
      { id: 'rob_9egb', nombre: 'Electrónica y Microcontroladores I', asignatura: 'Robótica', nivel: '9º EGB', clave: 'ROB9EGB' },
      { id: 'rob_10egb', nombre: 'Electrónica y Microcontroladores II', asignatura: 'Robótica', nivel: '10º EGB', clave: 'ROB10EGB' },
      { id: 'rob_1bgu', nombre: 'Robótica Aplicada - Micro:bit y Arduino', asignatura: 'Robótica', nivel: '1º BGU', clave: 'ROB1BGU' },
      { id: 'rob_2bgu', nombre: 'Robótica Avanzada - ESP32 y Domótica', asignatura: 'Robótica', nivel: '2º BGU', clave: 'ROB2BGU' },
      { id: 'rob_3bgu', nombre: 'Mecatrónica y Proyectos de Automatización', asignatura: 'Robótica', nivel: '3º BGU', clave: 'ROB3BGU' }
    ];

    const defaultActividades = [
      { id: 'act1', cursoId: 'mat3', tipo: 'Prueba', titulo: 'Evaluación: Límites e Indeterminaciones', detalle: '10 Preguntas de opción múltiple', fechaLimite: '2026-10-15', tiempo: 30 },
      { id: 'act2', cursoId: 'rob_2bgu', tipo: 'Tarea', titulo: 'Deber 1: Diagrama de Conexiones ESP32', detalle: 'Subir esquemático en formato PDF con la guía de puertos asignada.', fechaLimite: '2026-10-10', tiempo: 0 },
      { id: 'act3', cursoId: 'rob_5egb', tipo: 'Tarea', titulo: 'Deber 1: Diseño de Mecanismo de Transmisión', detalle: 'Adjuntar ficha de trabajo en PDF.', fechaLimite: '2026-10-05', tiempo: 0 }
    ];

    const defaultEntregas = [
      { id: 'ent1', actividadId: 'act2', cursoId: 'rob_2bgu', estudiante: 'Benítez Carlos', archivoNombre: 'Deber_ESP32_Benitez.pdf', archivoData: '', fecha: '2026-09-25 14:30', nota: 10.00 },
      { id: 'ent2', actividadId: 'act2', cursoId: 'rob_2bgu', estudiante: 'Alvarado Ana', archivoNombre: 'Tarea1_Alvarado.pdf', archivoData: '', fecha: '2026-09-25 10:15', nota: 9.50 }
    ];

    let db = {
      cursos: JSON.parse(localStorage.getItem('eva_cursos')) || defaultCursos,
      actividades: JSON.parse(localStorage.getItem('eva_actividades')) || defaultActividades,
      entregas: JSON.parse(localStorage.getItem('eva_entregas')) || defaultEntregas
    };

    function saveData() {
      try {
        localStorage.setItem('eva_cursos', JSON.stringify(db.cursos));
        localStorage.setItem('eva_actividades', JSON.stringify(db.actividades));
        localStorage.setItem('eva_entregas', JSON.stringify(db.entregas));
        localStorage.setItem('eva_admin_password', adminPassword);
        localStorage.setItem('eva_theme_color', currentTheme);

        // Notificar cambios a otros navegadores o pestañas abiertas
        syncChannel.postMessage({ type: 'SYNC_UPDATE', password: adminPassword, theme: currentTheme, db: db });
      } catch (e) {
        console.warn("Storage limit reached.");
      }
    }

    // Escuchar actualizaciones de otros equipos/pestañas
    syncChannel.onmessage = (event) => {
      if (event.data && event.data.type === 'SYNC_UPDATE') {
        if (event.data.password) adminPassword = event.data.password;
        if (event.data.theme) {
          currentTheme = event.data.theme;
          applyTheme(currentTheme);
        }
        if (event.data.db) db = event.data.db;
        
        if (currentRole === 'docente') renderDocenteView();
        else renderEstudianteView();
        lucide.createIcons();
      }
    };

    function applyTheme(themeKey) {
      currentTheme = themeKey;
      const palette = themePalettes[themeKey] || themePalettes.indigo;
      
      const header = document.getElementById('app-header');
      const headerSub = document.getElementById('app-header-sub');
      const logoBg = document.getElementById('app-logo-bg');
      const pdfHeader = document.getElementById('pdf-modal-header');

      header.className = `${palette.headerBg} text-white shadow-md py-3.5 px-6 flex justify-between items-center sticky top-0 z-50 transition-colors duration-300`;
      headerSub.className = `text-xs ${palette.headerSub}`;
      logoBg.className = `${palette.logoBg} p-2 rounded-lg text-indigo-200 transition-colors`;
      pdfHeader.className = `${palette.headerBg} text-white px-5 py-3 flex justify-between items-center transition-colors`;

      localStorage.setItem('eva_theme_color', themeKey);
    }

    function switchRole(role) {
      if (role === 'docente') {
        // Verificar contraseña sincronizada
        const passInput = prompt("Acceso Restringido para el Docente.\n\nIngresa la contraseña de administrador:");
        if (passInput === null) return;
        
        // Obtención directa del almacenamiento actualizado
        const latestSavedPass = localStorage.getItem('eva_admin_password') || adminPassword;

        if (passInput.trim() !== latestSavedPass.trim()) {
          alert("❌ Contraseña incorrecta. Acceso denegado.");
          return;
        }
      }

      currentRole = role;
      const btnStudent = document.getElementById('btn-role-student');
      const btnTeacher = document.getElementById('btn-role-teacher');
      const avatar = document.getElementById('user-avatar');
      const name = document.getElementById('user-name-display');

      const palette = themePalettes[currentTheme] || themePalettes.indigo;

      if (role === 'estudiante') {
        btnStudent.className = `px-3 py-1.5 rounded-md font-semibold transition-all ${palette.accentBg} text-white shadow`;
        btnTeacher.className = "px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white flex items-center gap-1";
        avatar.innerText = "E";
        name.innerText = "Estudiante";
        renderEstudianteView();
      } else {
        btnTeacher.className = `px-3 py-1.5 rounded-md font-semibold transition-all ${palette.accentBg} text-white shadow flex items-center gap-1`;
        btnStudent.className = "px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white";
        avatar.innerText = "D";
        name.innerText = "Docente Administrador";
        renderDocenteView();
      }
      lucide.createIcons();
    }

    function changeAdminPassword() {
      const currentPassStored = localStorage.getItem('eva_admin_password') || adminPassword;
      const actual = prompt("Seguridad Docente:\n\nIngresa la contraseña ACTUAL del docente:");
      
      if (actual === null) return;
      if (actual.trim() !== currentPassStored.trim()) {
        alert("❌ La contraseña actual ingresada es incorrecta.");
        return;
      }

      const nueva = prompt("Ingresa la NUEVA contraseña para la Vista Docente:");
      if (!nueva || nueva.trim() === "") {
        alert("La contraseña no puede estar vacía.");
        return;
      }

      const confirmacion = prompt("Confirma la NUEVA contraseña:");
      if (nueva.trim() === confirmacion.trim()) {
        adminPassword = nueva.trim();
        saveData(); // Guarda localmente y transmite la sincronización
        alert("¡Contraseña del docente actualizada con éxito en todos los dispositivos!");
      } else {
        alert("❌ Las contraseñas no coinciden. No se realizaron cambios.");
      }
    }

    function accessCourse(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      if (currentRole === 'docente') {
        openCourse(cursoId);
        return;
      }

      const userKey = prompt(`🔒 CURSO CON ACCESO RESTRINGIDO\n\nAsignatura: ${curso.nombre} (${curso.nivel})\n\nPor favor, ingresa la clave del curso proporcionada por tu docente:`);
      if (userKey === null) return;

      if (userKey.trim() === curso.clave) {
        openCourse(cursoId);
      } else {
        alert("❌ Clave incorrecta. No tienes permiso para acceder a este curso.");
      }
    }

    // ----------------------------------------------------
    // VISTA ESTUDIANTE
    // ----------------------------------------------------
    function renderEstudianteView() {
      const palette = themePalettes[currentTheme] || themePalettes.indigo;

      const cursosCards = db.cursos.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all flex flex-col">
          <div class="${palette.accentBg} h-2"></div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold uppercase tracking-wider ${palette.accentText} ${palette.accentLightBg} px-2.5 py-1 rounded-md">${c.asignatura}</span>
                <span class="text-xs font-semibold text-slate-400">${c.nivel}</span>
              </div>
              <h3 class="text-base font-bold text-slate-900 mt-1">${c.nombre}</h3>
              <p class="text-slate-500 text-xs mt-1.5">Requiere clave de matriculación para ingresar y subir archivos.</p>
            </div>
            
            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-500"></i> Protegido
              </span>
              <button onclick="accessCourse('${c.id}')" class="${palette.accentBg} ${palette.accentHover} text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
                <i data-lucide="key" class="w-3.5 h-3.5"></i> Ingresar al Curso
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="mb-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-200 pb-5">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Catálogo de Cursos y Asignaturas</h1>
            <p class="text-slate-500 text-sm">Selecciona tu materia e ingresa tu clave para enviar tus deberes en formato PDF.</p>
          </div>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${palette.accentLightBg} ${palette.accentText} border ${palette.borderAccent} self-start">
            <i data-lucide="shield-check" class="w-4 h-4"></i> Acceso Seguro Activo
          </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${cursosCards}
        </div>
      `;
    }

    // ----------------------------------------------------
    // DENTRO DEL CURSO DESBLOQUEADO
    // ----------------------------------------------------
    function openCourse(cursoId) {
      const palette = themePalettes[currentTheme] || themePalettes.indigo;
      const curso = db.cursos.find(c => c.id === cursoId);
      const acts = db.actividades.filter(a => a.cursoId === cursoId);

      const actsHTML = acts.length > 0 ? acts.map(a => {
        const entregasActividad = db.entregas.filter(e => e.actividadId === a.id);
        const hoy = new Date().toISOString().split('T')[0];
        const estaVencida = a.fechaLimite && a.fechaLimite < hoy;

        return `
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-200 pb-3">
              <div>
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded ${a.tipo === 'Prueba' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
                    ${a.tipo}
                  </span>
                  ${a.fechaLimite ? `
                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded flex items-center gap-1 ${estaVencida ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">
                      <i data-lucide="calendar" class="w-3 h-3"></i> Plazo: ${a.fechaLimite}${estaVencida ? '(Vencido)' : ''}
                    </span>
                  ` : ''}
                  ${a.tiempo > 0 ? `<span class="text-xs text-slate-500 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${a.tiempo} min</span>` : ''}
                </div>
                <h4 class="font-bold text-slate-900 text-base">${a.titulo}</h4>
                <p class="text-xs text-slate-600 mt-0.5">${a.detalle}</p>
              </div>

              ${currentRole === 'docente' ? `
                <button onclick="extendDeadline('${a.id}', '${curso.id}')" class="text-xs bg-amber-50 text-amber-800 border border-amber-300 hover:bg-amber-100 font-bold px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 self-start">
                  <i data-lucide="calendar-plus" class="w-3.5 h-3.5 text-amber-600"></i> Aplazar / Cambiar Fecha
                </button>
              ` : ''}
            </div>

            ${a.tipo === 'Tarea' ? `
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                  <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                    <i data-lucide="upload-cloud" class="w-4 h-4 ${palette.accentText}"></i> Entrega de Tarea (Formato PDF)
                  </span>
                  <span class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2 py-0.5 rounded">Curso Verificado</span>
                </div>

                <form onsubmit="submitHomework(event, '${a.id}', '${curso.id}')" class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Apellidos y Nombres del Estudiante:</label>
                    <input type="text" id="student-name-${a.id}" placeholder="Ej: Pérez Juan" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Seleccionar Documento PDF:</label>
                    <div class="relative border-2 border-dashed border-slate-300 hover:border-slate-400 bg-slate-50/50 rounded-lg p-3 text-center transition-colors">
                      <input type="file" id="student-file-${a.id}" accept=".pdf" required onchange="handleFileSelect('${a.id}')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                      <div class="flex flex-col items-center justify-center gap-1">
                        <i data-lucide="file-up" class="w-6 h-6 ${palette.accentText}"></i>
                        <span id="file-label-${a.id}" class="text-xs font-medium text-slate-600">Haz clic aquí para adjuntar tu archivo PDF</span>
                      </div>
                    </div>
                  </div>

                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i> Subir y Registrar Tarea
                  </button>
                </form>

                ${entregasActividad.length > 0 ? `
                  <div class="mt-4 pt-3 border-t border-slate-100">
                    <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-2">Entregas enviadas en este curso:</span>
                    <div class="space-y-1.5">
                      ${entregasActividad.map(e => `
                        <div class="flex items-center justify-between text-xs bg-slate-50 p-2 rounded-lg border border-slate-200">
                          <span class="font-medium text-slate-800">${e.estudiante}</span>
                          <div class="flex items-center gap-2">
                            <button onclick="previewPDF('${e.id}')" class="text-rose-700 hover:text-rose-900 font-semibold flex items-center gap-1 hover:underline">
                              <i data-lucide="file-text" class="w-3 h-3"></i> ${e.archivoNombre}
                            </button>
                            ${currentRole === 'docente' ? `
                              <button onclick="deleteSubmission('${e.id}', '${curso.id}')" class="text-rose-600 hover:text-rose-800 p-1" title="Eliminar Deber">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>

    function extendDeadline(actId, cursoId) {
      const act = db.actividades.find(a => a.id === actId);
      const nuevaFecha = prompt(`Aplazar / Cambiar Fecha Límite de Entrega\n\nTarea: "${act.titulo}"\nFecha Actual: ${act.fechaLimite || 'Sin fecha'}\n\nIngresa la nueva fecha límite (YYYY-MM-DD):`, act.fechaLimite || '');

      if (nuevaFecha !== null && nuevaFecha.trim() !== '') {
        act.fechaLimite = nuevaFecha.trim();
        saveData();
        alert(`¡Fecha límite aplazada con éxito al ${act.fechaLimite}!`);

      }

    function deleteSubmission(entregaId, cursoId = null) {
      const entrega = db.entregas.find(e => e.id === entregaId);
      if (confirm(`¿Estás seguro de eliminar el deber entregado por "${entrega.estudiante}"?`)) {
        db.entregas = db.entregas.filter(e => e.id !== entregaId);
        saveData();
        alert("Deber eliminado correctamente.");
        if (cursoId) {
          openCourse(cursoId);
        } else {
          renderDocenteView();
          lucide.createIcons();
        }
      }
    }

    function handleFileSelect(actId) {
      const fileInput = document.getElementById(`student-file-${actId}`);
      const label = document.getElementById(`file-label-${actId}`);
      if (fileInput.files && fileInput.files[0]) {
        label.innerText = "📄 PDF Seleccionado: " + fileInput.files[0].name;
        label.classList.add("text-indigo-700", "font-bold");
      }
    }

    function submitHomework(event, actId, cursoId) {
      event.preventDefault();
      
      const studentInput = document.getElementById(`student-name-${actId}`);
      const fileInput = document.getElementById(`student-file-${actId}`);

      if (!studentInput || !studentInput.value.trim()) {
        alert("Por favor ingresa los Apellidos y Nombres del Estudiante.");
        return;
      }

      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert("Por favor selecciona un archivo PDF.");
        return;
      }

      const studentName = studentInput.value.trim();
      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const nuevaEntrega = {
          id: 'ent_' + Date.now(),
          actividadId: actId,
          cursoId: cursoId,
          estudiante: studentName,
          archivoNombre: file.name,
          archivoData: e.target.result,
          fecha: new Date().toISOString().replace('T', ' ').substring(0, 16),
          nota: 0.00
        };

        db.entregas.push(nuevaEntrega);
        saveData();
        
        alert(`¡Éxito! Tarea de "${studentName}" registrada correctamente.`);
        openCourse(cursoId);
      };

      reader.readAsDataURL(file);
    }

    function gradeAssignment(entregaId) {
      const entrega = db.entregas.find(e => e.id === entregaId);
      const val = prompt(`Ingresa la nota sobre 10 para ${entrega.estudiante}:`, entrega.nota || 10);
      if (val !== null && !isNaN(val)) {
        entrega.nota = parseFloat(val);
        saveData();
        alert(`Nota de ${entrega.estudiante} guardada: ${entrega.nota.toFixed(2)}/10`);
        renderDocenteView();
        lucide.createIcons();
      }
    }

    function addNewCourse(event) {
      event.preventDefault();
      const name = document.getElementById('new-course-name').value.trim();
      const subject = document.getElementById('new-course-subject').value.trim();
      const level = document.getElementById('new-course-level').value.trim();
      const key = document.getElementById('new-course-key').value.trim();

      db.cursos.push({
        id: 'c_' + Date.now(),
        nombre: name,
        asignatura: subject,
        nivel: level,
        clave: key
      });

      saveData();
      alert(`Curso "${name}" publicado exitosamente con clave "${key}".`);
      renderDocenteView();
      lucide.createIcons();
    }

    function deleteCourse(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      if (confirm(`¿Deseas eliminar el curso "${curso.nombre}"?`)) {
        db.cursos = db.cursos.filter(c => c.id !== cursoId);
        db.actividades = db.actividades.filter(a => a.cursoId !== cursoId);
        db.entregas = db.entregas.filter(e => e.cursoId !== cursoId);
        saveData();
        renderDocenteView();
        lucide.createIcons();
      }
    }

    function changeKey(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      const newKey = prompt(`Nueva clave de acceso para "${curso.nombre}":`, curso.clave);
      if (newKey && newKey.trim() !== '') {
        curso.clave = newKey.trim();
        saveData();
        renderDocenteView();
        lucide.createIcons();
      }
    }

    window.onload = () => {
      applyTheme(currentTheme);
      renderEstudianteView();
      lucide.createIcons();
    };
  </script>
</body>
</html>
