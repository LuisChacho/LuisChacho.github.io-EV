<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Virtual EVA - Portal del Estudiante</title>
  <!-- Tailwind CSS para el diseño UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Superior (Exclusivo Estudiante) -->
  <header class="bg-indigo-900 text-white shadow-md py-3.5 px-6 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-700 p-2 rounded-lg text-indigo-200">
        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
      </div>
      <div>
        <span class="text-xl font-bold tracking-wide block leading-none">Campus Virtual EVA</span>
        <span class="text-xs text-indigo-300">Portal del Estudiante</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3 text-sm font-medium">
      <span class="bg-indigo-800 text-indigo-100 px-3 py-1 rounded-full text-xs font-semibold">Estudiante</span>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs">
        E
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main id="main-content" class="flex-1 p-6 max-w-7xl mx-auto w-full">
    <!-- Carga dinámica del panel -->
  </main>

  <script>
    // Datos simulados de los cursos activos
    const cursosEstudiante = [
      { id: 'mat3', nombre: 'Matemática Superior', asignatura: 'Matemática', nivel: '3º BGU - Paralelo A', modulos: 4 },
      { id: 'fis2', nombre: 'Física General', asignatura: 'Física', nivel: '2º BGU - Paralelo B', modulos: 2 },
      { id: 'pre1', nombre: 'Razonamiento Cuantitativo', asignatura: 'Preuniversitario', nivel: 'Nivelación Intensiva', modulos: 5 }
    ];

    const evaluacionesActivas = [
      { id: 'ev1', cursoId: 'mat3', titulo: 'Evaluación: Límites e Indeterminaciones', tiempo: 30, preguntas: 10, activa: true },
      { id: 'ev2', cursoId: 'fis2', titulo: 'Prueba: Cinemática y Dinámica', tiempo: 45, preguntas: 15, activa: true },
      { id: 'ev3', cursoId: 'pre1', titulo: 'Simulador de Examen de Admisión', tiempo: 60, preguntas: 30, activa: false }
    ];

    function renderPortalEstudiante() {
      const cursosCards = cursosEstudiante.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all flex flex-col">
          <div class="bg-indigo-600 h-2"></div>
          <div class="p-6 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${c.asignatura}</span>
                <span class="text-xs font-semibold text-slate-400">${c.nivel}</span>
              </div>
              <h3 class="text-lg font-bold text-slate-900 mt-1">${c.nombre}</h3>
              <p class="text-slate-500 text-xs mt-2">Módulos de estudio, lecciones interactivas y material de apoyo.</p>
            </div>
            
            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                <i data-lucide="book-open" class="w-3.5 h-3.5 text-indigo-500"></i> ${c.modulos} Módulos
              </span>
              <button onclick="openCourse('${c.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
                Ingresar <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="mb-8 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-200 pb-5">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Mis Asignaturas y Cursos</h1>
            <p class="text-slate-500 text-sm">Selecciona tu curso para acceder a los módulos de estudio y evaluaciones.</p>
          </div>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 self-start">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Campus en línea
          </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          ${cursosCards}
        </div>
      `;
      lucide.createIcons();
    }

    function openCourse(cursoId) {
      const curso = cursosEstudiante.find(c => c.id === cursoId);
      const evs = evaluacionesActivas.filter(e => e.cursoId === cursoId);

      const evsHTML = evs.length > 0 ? evs.map(e => `
        <div class="bg-indigo-50/60 border border-indigo-100 rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold px-2 py-0.5 rounded ${e.activa ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                ${e.activa ? 'Disponible' : 'Cerrada'}
              </span>
              <span class="text-xs text-slate-500 flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${e.tiempo} minutos
              </span>
            </div>
            <h4 class="font-bold text-indigo-950 text-base">${e.titulo}</h4>
            <p class="text-xs text-slate-500 mt-0.5">${e.preguntas} Preguntas de selección múltiple</p>
          </div>

          ${e.activa ? `
            <div class="flex items-center gap-2">
              <input type="password" id="key-input-${e.id}" placeholder="Contraseña asignada..." class="px-3 py-2 border rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
              <button onclick="submitExamKey('${e.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-1">
                <i data-lucide="key" class="w-4 h-4"></i> Rendir
              </button>
            </div>
          ` : `<span class="text-xs text-slate-400 italic">No disponible</span>`}
        </div>
      `).join('') : '<p class="text-slate-500 text-sm">No hay evaluaciones programadas para este curso.</p>';

      document.getElementById('main-content').innerHTML = `
        <button onclick="renderPortalEstudiante()" class="mb-5 flex items-center gap-1.5 text-sm text-indigo-600 font-semibold hover:text-indigo-800 transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a mis cursos
        </button>

        <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
          <div class="border-b border-slate-100 pb-4 mb-6">
            <span class="text-xs font-bold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${curso.asignatura}</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">${curso.nombre}</h2>
            <p class="text-slate-500 text-sm">${curso.nivel}</p>
          </div>

          <div>
            <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
              <i data-lucide="file-check" class="w-5 h-5 text-indigo-600"></i> Evaluaciones Habilitadas
            </h3>
            <div class="space-y-4">
              ${evsHTML}
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function submitExamKey(evId) {
      const input = document.getElementById(`key-input-${evId}`);
      if (!input || !input.value.trim()) {
        alert("Ingresa la contraseña proporcionada por el docente para esta prueba.");
        return;
      }
      // La validación de la contraseña se realiza contra la base de datos de forma segura
      alert("Enviando clave para validación...");
    }

    window.onload = renderPortalEstudiante;
  </script>
</body>
</html>
