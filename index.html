<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Virtual EVA - Sistema de Aprendizaje</title>
  <!-- Tailwind CSS para el diseño UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Superior -->
  <header class="bg-indigo-900 text-white shadow-md py-3.5 px-6 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-700 p-2 rounded-lg text-indigo-200">
        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
      </div>
      <div>
        <span class="text-xl font-bold tracking-wide block leading-none">Campus Virtual EVA</span>
        <span class="text-xs text-indigo-300">Plataforma de Aprendizaje y Evaluación</span>
      </div>
    </div>
    
    <!-- Selector de Rol (Con Protección Estricta de Clave) -->
    <div class="flex items-center gap-4 text-sm font-medium">
      <div class="bg-indigo-800/80 p-1 rounded-lg border border-indigo-700 flex text-xs">
        <button id="btn-role-student" onclick="switchRole('estudiante')" class="px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow">
          Vista Estudiante
        </button>
        <button id="btn-role-teacher" onclick="switchRole('docente')" class="px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white flex items-center gap-1">
          <i data-lucide="lock" class="w-3 h-3"></i> Vista Docente
        </button>
      </div>
      <div class="hidden md:flex items-center gap-2 border-l border-indigo-700 pl-4">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs" id="user-avatar">
          E
        </div>
        <span id="user-name-display" class="text-sm">Estudiante</span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main id="main-content" class="flex-1 p-6 max-w-7xl mx-auto w-full">
    <!-- Carga dinámica -->
  </main>

  <script>
    // Estado Global de la App en Memoria
    let currentRole = 'estudiante'; 
    const ADMIN_PASSWORD = "Luis0316"; // Contraseña requerida
    
    // Base de Datos en Memoria
    const db = {
      cursos: [
        { id: 'mat3', nombre: 'Matemática Superior', asignatura: 'Matemática', nivel: '3º BGU - Paralelo A', clave: 'MAT2026', actividades: 4 },
        { id: 'fis2', nombre: 'Física General', asignatura: 'Física', nivel: '2º BGU - Paralelo B', clave: 'FIS2026', actividades: 2 },
        { id: 'pre1', nombre: 'Razonamiento Cuantitativo', asignatura: 'Preuniversitario', nivel: 'Nivelación Intensiva', clave: 'PRE2026', actividades: 5 }
      ],
      evaluaciones: [
        { id: 'ev1', cursoId: 'mat3', titulo: 'Evaluación: Límites e Indeterminaciones', tiempo: 30, preguntas: 10, activa: true },
        { id: 'ev2', cursoId: 'fis2', titulo: 'Prueba: Cinemática y Dinámica', tiempo: 45, preguntas: 15, activa: true },
        { id: 'ev3', cursoId: 'pre1', titulo: 'Simulador de Examen de Admisión', tiempo: 60, preguntas: 30, activa: false }
      ],
      notas: [
        { id: 1, estudiante: 'Carlos Mendoza', curso: 'Matemática Superior', nivel: '3º BGU - Paralelo A', evaluacion: 'Límites e Indeterminaciones', nota: 9.50, fecha: '2026-09-25' },
        { id: 2, estudiante: 'Ana Lucía Gómez', curso: 'Matemática Superior', nivel: '3º BGU - Paralelo A', evaluacion: 'Límites e Indeterminaciones', nota: 8.00, fecha: '2026-09-25' },
        { id: 3, estudiante: 'Mateo Ramos', curso: 'Física General', nivel: '2º BGU - Paralelo B', evaluacion: 'Cinemática y Dinámica', nota: 10.00, fecha: '2026-09-26' }
      ]
    };

    // Alternar Roles solicitando la clave SIEMPRE para el docente
    function switchRole(role) {
      if (role === 'docente') {
        const passInput = prompt("Acceso Restringido para el Docente.\n\nIngresa la contraseña de administrador:");
        
        if (passInput === null) {
          return; // Si el estudiante presiona Cancelar, no hace nada y permanece en su vista
        }

        if (passInput !== ADMIN_PASSWORD) {
          alert("Contraseña incorrecta. Acceso denegado.");
          return; // Bloquea el acceso si la contraseña no coincide exactamente
        }

        alert("¡Acceso concedido! Entrando al Panel del Docente.");
      }

      currentRole = role;
      const btnStudent = document.getElementById('btn-role-student');
      const btnTeacher = document.getElementById('btn-role-teacher');
      const avatar = document.getElementById('user-avatar');
      const name = document.getElementById('user-name-display');

      if (role === 'estudiante') {
        btnStudent.className = "px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow";
        btnTeacher.className = "px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white flex items-center gap-1";
        avatar.innerText = "E";
        name.innerText = "Estudiante";
        renderEstudianteView();
      } else {
        btnTeacher.className = "px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow flex items-center gap-1";
        btnStudent.className = "px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white";
        avatar.innerText = "D";
        name.innerText = "Docente Administrador";
        renderDocenteView();
      }
      lucide.createIcons();
    }

    // ----------------------------------------------------
    // VISTA DEL ESTUDIANTE
    // ----------------------------------------------------
    function renderEstudianteView() {
      const cursosCards = db.cursos.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all flex flex-col">
          <div class="bg-indigo-600 h-2"></div>
          <div class="p-6 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${c.asignatura}</span>
                <span class="text-xs font-semibold text-slate-400">${c.nivel}</span>
              </div>
              <h3 class="text-lg font-bold text-slate-900 mt-1">${c.nombre}</h3>
              <p class="text-slate-500 text-xs mt-2">Módulos de estudio, lecciones interactivas y material de apoyo.</p>
            </div>
            
            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                <i data-lucide="book-open" class="w-3.5 h-3.5 text-indigo-500"></i> ${c.actividades} Módulos
              </span>
              <button onclick="openCourseStudent('${c.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
                Ingresar <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="mb-8 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-200 pb-5">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Mis Asignaturas y Cursos</h1>
            <p class="text-slate-500 text-sm">Entorno Virtual de Aprendizaje - Selecciona tu curso asignado.</p>
          </div>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 self-start">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Activo
          </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          ${cursosCards}
        </div>
      `;
    }

    // Abrir Curso para Estudiante
    function openCourseStudent(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      const evs = db.evaluaciones.filter(e => e.cursoId === cursoId);

      const evsHTML = evs.length > 0 ? evs.map(e => `
        <div class="bg-indigo-50/60 border border-indigo-100 rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold px-2 py-0.5 rounded ${e.activa ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                ${e.activa ? 'Disponible' : 'Cerrada'}
              </span>
              <span class="text-xs text-slate-500 flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${e.tiempo} minutos
              </span>
            </div>
            <h4 class="font-bold text-indigo-950 text-base">${e.titulo}</h4>
            <p class="text-xs text-slate-500 mt-0.5">${e.preguntas} Preguntas de selección múltiple</p>
          </div>

          ${e.activa ? `
            <div class="flex items-center gap-2">
              <input type="password" id="key-input-${e.id}" placeholder="Contraseña de la prueba..." class="px-3 py-2 border rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
              <button onclick="validateKey('${e.id}', '${curso.clave}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-1">
                <i data-lucide="key" class="w-4 h-4"></i> Rendir
              </button>
            </div>
          ` : `<span class="text-xs text-slate-400 italic">No disponible actualmente</span>`}
        </div>
      `).join('') : '<p class="text-slate-500 text-sm">No hay evaluaciones programadas para esta asignatura.</p>';

      document.getElementById('main-content').innerHTML = `
        <button onclick="renderEstudianteView(); lucide.createIcons();" class="mb-5 flex items-center gap-1.5 text-sm text-indigo-600 font-semibold hover:text-indigo-800 transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a mis cursos
        </button>

        <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm mb-6">
          <div class="border-b border-slate-100 pb-4 mb-6">
            <span class="text-xs font-bold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${curso.asignatura}</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">${curso.nombre}</h2>
            <p class="text-slate-500 text-sm">${curso.nivel}</p>
          </div>

          <div>
            <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
              <i data-lucide="file-check" class="w-5 h-5 text-indigo-600"></i> Evaluaciones y Exámenes Activos
            </h3>
            <div class="space-y-4">
              ${evsHTML}
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // Validar contraseña del examen
    function validateKey(evId, correctKey) {
      const input = document.getElementById(`key-input-${evId}`);
      if (!input || !input.value) {
        alert("Por favor ingresa la contraseña para desbloquear el examen.");
        return;
      }

      if (input.value === correctKey) {
        alert("¡Contraseña Correcta! Accediendo a la prueba interactiva...");
      } else {
        alert("Contraseña incorrecta. Consulta a tu docente asignado.");
      }
    }

    // ----------------------------------------------------
    // VISTA DEL DOCENTE (Panel Protegido)
    // ----------------------------------------------------
    function renderDocenteView() {
      const cursosTableRows = db.cursos.map(c => `
        <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
          <td class="py-3.5 px-4 font-bold text-slate-900">${c.nombre}</td>
          <td class="py-3.5 px-4 text-slate-600">${c.nivel}</td>
          <td class="py-3.5 px-4 font-semibold text-indigo-600">${c.asignatura}</td>
          <td class="py-3.5 px-4">
            <span class="font-mono bg-amber-50 text-amber-800 border border-amber-200 px-2.5 py-1 rounded-md text-xs font-bold inline-flex items-center gap-1">
              <i data-lucide="lock" class="w-3 h-3"></i> ${c.clave}
            </span>
          </td>
          <td class="py-3.5 px-4">
            <button onclick="changeKey('${c.id}')" class="text-xs bg-slate-900 hover:bg-slate-800 text-white font-medium px-3 py-1.5 rounded-lg transition-colors">
              Cambiar Clave
            </button>
          </td>
        </tr>
      `).join('');

      const notasRows = db.notas.map(n => `
        <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
          <td class="py-3.5 px-4 font-bold text-slate-900">${n.estudiante}</td>
          <td class="py-3.5 px-4 text-slate-600">${n.curso}</td>
          <td class="py-3.5 px-4 text-xs text-slate-500">${n.nivel}</td>
          <td class="py-3.5 px-4 text-slate-700">${n.evaluacion}</td>
          <td class="py-3.5 px-4">
            <span class="font-bold px-2.5 py-1 rounded-md text-xs ${n.nota >= 7 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
              ${n.nota.toFixed(2)} / 10.00
            </span>
          </td>
        </tr>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="mb-8 border-b border-slate-200 pb-5 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Panel de Control del Docente</h1>
            <p class="text-slate-500 text-sm">Gestiona claves de examen por curso y supervisa las notas en tiempo real.</p>
          </div>
          <button onclick="switchRole('estudiante')" class="bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 text-xs font-bold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 self-start">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Salir de Vista Docente
          </button>
        </div>

        <!-- Tabla 1: Gestión de Claves de los Exámenes -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
          <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
              <i data-lucide="key-round" class="w-5 h-5 text-indigo-600"></i> Asignación de Contraseñas por Curso / Nivel
            </h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-100/70 text-slate-600 uppercase text-xs font-bold">
                  <th class="py-3 px-4">Curso</th>
                  <th class="py-3 px-4">Nivel / Paralelo</th>
                  <th class="py-3 px-4">Asignatura</th>
                  <th class="py-3 px-4">Contraseña Activa</th>
                  <th class="py-3 px-4">Acciones</th>
                </tr>
              </thead>
              <tbody>
                ${cursosTableRows}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Tabla 2: Libro de Calificaciones -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
              <i data-lucide="clipboard-list" class="w-5 h-5 text-indigo-600"></i> Libro de Calificaciones General
            </h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-100/70 text-slate-600 uppercase text-xs font-bold">
                  <th class="py-3 px-4">Estudiante</th>
                  <th class="py-3 px-4">Curso</th>
                  <th class="py-3 px-4">Nivel</th>
                  <th class="py-3 px-4">Actividad / Prueba</th>
                  <th class="py-3 px-4">Calificación</th>
                </tr>
              </thead>
              <tbody>
                ${notasRows}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Cambiar la clave de un curso como docente
    function changeKey(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      const newKey = prompt(`Asigna una nueva contraseña de examen para "${curso.nombre}" (${curso.nivel}):`, curso.clave);
      
      if (newKey && newKey.trim() !== '') {
        curso.clave = newKey.trim();
        alert(`¡Contraseña de ${curso.nombre} actualizada con éxito a: ${curso.clave}`);
        renderDocenteView();
        lucide.createIcons();
      }
    }

    // Inicializar al cargar
    window.onload = () => {
      renderEstudianteView();
      lucide.createIcons();
    };
  </script>
</body>
</html>
