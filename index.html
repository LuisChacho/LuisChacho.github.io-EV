<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Virtual de Aprendizaje (EVA)</title>
  <!-- Tailwind CSS para el diseño UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

  <div id="app" class="min-h-screen flex flex-col">
    <!-- Navbar Superior -->
    <header class="bg-indigo-900 text-white shadow-md py-3 px-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i data-lucide="graduation-cap" class="w-8 h-8 text-indigo-300"></i>
        <span class="text-xl font-bold tracking-wide">Campus Virtual EVA</span>
      </div>
      <div id="user-status" class="flex items-center gap-4 text-sm font-medium">
        <!-- Se llena dinámicamente -->
      </div>
    </header>

    <!-- Contenido Principal -->
    <main id="main-content" class="flex-1 p-6 max-w-7xl mx-auto w-full">
      <!-- Vistas cargadas vía JS -->
    </main>
  </div>

  <script>
    // Configuración de Supabase (Reemplaza con tus llaves)
    const SUPABASE_URL = 'HTTPS://TU-PROYECTO.SUPABASE.CO';
    const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userProfile = null;

    // Inicialización de la App
    async function init() {
      lucide.createIcons();
      const { data: { session } } = await supabase.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        await fetchProfile();
        renderDashboard();
      } else {
        renderLogin();
      }
    }

    // Obtener Perfil del Usuario
    async function fetchProfile() {
      const { data } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      userProfile = data;
    }

    // ----------------------------------------------------
    // VISTA: LOGIN / REGISTRO
    // ----------------------------------------------------
    function renderLogin() {
      document.getElementById('user-status').innerHTML = '';
      document.getElementById('main-content').innerHTML = `
        <div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow-lg border border-slate-100 p-8">
          <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Iniciar Sesión</h2>
            <p class="text-slate-500 text-sm">Ingresa a tu entorno virtual de aprendizaje</p>
          </div>
          <form id="login-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
              <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
              <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
              Ingresar al EVA
            </button>
          </form>
        </div>
      `;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert('Error de autenticación: ' + error.message);
        else init();
      });
    }

    // ----------------------------------------------------
    // VISTA: DASHBOARD PRINCIPAL
    // ----------------------------------------------------
    async function renderDashboard() {
      // Renderizar Navbar User Status
      document.getElementById('user-status').innerHTML = `
        <span class="bg-indigo-800 text-indigo-100 px-3 py-1 rounded-full text-xs font-semibold capitalize">${userProfile.rol}</span>
        <span>${userProfile.nombre_completo}</span>
        <button onclick="logout()" class="text-indigo-200 hover:text-white transition-colors">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      `;

      if (userProfile.rol === 'docente') {
        renderDocenteDashboard();
      } else {
        renderEstudianteDashboard();
      }
      lucide.createIcons();
    }

    // ----------------------------------------------------
    // DASHBOARD DEL ESTUDIANTE (Solo ve sus cursos)
    // ----------------------------------------------------
    async function renderEstudianteDashboard() {
      // Consultar cursos matriculados del estudiante
      const { data: matriculas } = await supabase
        .from('matriculas')
        .select('cursos(*)')
        .eq('estudiante_id', currentUser.id);

      let cursosHTML = '';
      if (matriculas && matriculas.length > 0) {
        cursosHTML = matriculas.map(m => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
            <div class="bg-indigo-600 h-2"></div>
            <div class="p-6">
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">${m.cursos.asignatura}</span>
              <h3 class="text-lg font-bold text-slate-900 mt-1">${m.cursos.nombre}</h3>
              <div class="mt-6 flex gap-3">
                <button onclick="abrirCurso('${m.cursos.id}', '${m.cursos.nombre}')" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2 rounded-lg transition-colors">
                  Ingresar al Curso
                </button>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        cursosHTML = `<p class="col-span-full text-slate-500">No estás matriculado en ningún curso actualmente.</p>`;
      }

      document.getElementById('main-content').innerHTML = `
        <div class="mb-8">
          <h1 class="text-2xl font-bold text-slate-900">Mis Asignaturas y Cursos</h1>
          <p class="text-slate-500 text-sm">Accede a tus módulos de estudio y evaluaciones activas.</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          ${cursosHTML}
        </div>
      `;
    }

    // Modulo para ingresar a un curso e intentar dar evaluación con clave
    async function abrirCurso(cursoId, nombreCurso) {
      const { data: evaluaciones } = await supabase
        .from('evaluaciones')
        .select('*')
        .eq('curso_id', cursoId)
        .eq('activa', true);

      let evaluacionesHTML = '';
      if (evaluaciones && evaluaciones.length > 0) {
        evaluacionesHTML = evaluaciones.map(ev => `
          <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4 flex justify-between items-center">
            <div>
              <h4 class="font-bold text-indigo-950">${ev.titulo}</h4>
              <p class="text-xs text-indigo-700">Tiempo límite: ${ev.tiempo_limite_min} minutos</p>
            </div>
            <button onclick="solicitarClave('${ev.id}', '${cursoId}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">
              Rendir Prueba
            </button>
          </div>
        `).join('');
      } else {
        evaluacionesHTML = `<p class="text-sm text-slate-500">No hay evaluaciones programadas para este curso.</p>`;
      }

      document.getElementById('main-content').innerHTML = `
        <button onclick="renderDashboard()" class="mb-4 flex items-center gap-2 text-sm text-indigo-600 font-semibold">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a mis cursos
        </button>
        <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
          <h2 class="text-xl font-bold text-slate-900 mb-2">${nombreCurso}</h2>
          <div class="mt-6 border-t pt-4">
            <h3 class="font-bold text-slate-800 mb-4">Evaluaciones Disponibles</h3>
            <div class="space-y-3">
              ${evaluacionesHTML}
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // Validación de la contraseña asignada por el Docente
    async function solicitarClave(evaluacionId, cursoId) {
      const claveIngresada = prompt("Ingresa la contraseña proporcionada por el docente para esta prueba:");
      if (!claveIngresada) return;

      // Consultar la clave real en la BD para ese curso
      const { data: curso } = await supabase
        .from('cursos')
        .select('clave_examen')
        .eq('id', cursoId)
        .single();

      if (curso && curso.clave_examen === claveIngresada) {
        iniciarExamen(evaluacionId);
      } else {
        alert("Contraseña incorrecta. No tienes acceso a esta evaluación.");
      }
    }

    async function iniciarExamen(evaluacionId) {
      alert("Contraseña correcta. Cargando el entorno de evaluación...");
      // Lógica de renderizado del cuestionario con temporizador y auto-envío de notas
    }

    // ----------------------------------------------------
    // DASHBOARD DEL DOCENTE (Gestión, Claves y Notas)
    // ----------------------------------------------------
    async function renderDocenteDashboard() {
      const { data: cursos } = await supabase.from('cursos').select('*');

      let cursosRows = cursos ? cursos.map(c => `
        <tr class="border-b hover:bg-slate-50">
          <td class="py-3 px-4 font-semibold">${c.nombre}</td>
          <td class="py-3 px-4">${c.asignatura}</td>
          <td class="py-3 px-4">
            <span class="font-mono bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-bold">${c.clave_examen || 'Sin clave'}</span>
          </td>
          <td class="py-3 px-4 flex gap-2">
            <button onclick="cambiarClave('${c.id}')" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded hover:bg-slate-700">
              Asignar Clave
            </button>
            <button onclick="verNotasCurso('${c.id}')" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded hover:bg-indigo-700">
              Ver Notas
            </button>
          </td>
        </tr>
      `).join('') : '';

      document.getElementById('main-content').innerHTML = `
        <div class="mb-8 flex justify-between items-center">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Panel de Control Docente</h1>
            <p class="text-slate-500 text-sm">Administra tus cursos, establece contraseñas de examen y supervisa notas.</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-6 border-b border-slate-100">
            <h2 class="font-bold text-slate-800">Cursos y Niveles Registrados</h2>
          </div>
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                <th class="py-3 px-4">Curso / Nivel</th>
                <th class="py-3 px-4">Asignatura</th>
                <th class="py-3 px-4">Clave de Examen Activa</th>
                <th class="py-3 px-4">Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${cursosRows}
            </tbody>
          </table>
        </div>
      `;
    }

    // Cambio de contraseña instantáneo desde el panel docente
    async function cambiarClave(cursoId) {
      const nuevaClave = prompt("Ingresa la nueva contraseña para las evaluaciones de este curso:");
      if (nuevaClave === null) return;

      const { error } = await supabase
        .from('cursos')
        .update({ clave_examen: nuevaClave })
        .eq('id', cursoId);

      if (!error) {
        alert("Contraseña actualizada en tiempo real.");
        renderDocenteDashboard();
      } else {
        alert("Error al actualizar la contraseña: " + error.message);
      }
    }

    // Cerrar Sesión
    async function logout() {
      await supabase.auth.signOut();
      init();
    }

    // Arrancar la aplicación al cargar la página
    window.onload = init;
  </script>
</body>
</html>
