<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Virtual EVA - Sistema de Aprendizaje</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Superior -->
  <header class="bg-indigo-900 text-white shadow-md py-3.5 px-6 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-700 p-2 rounded-lg text-indigo-200">
        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
      </div>
      <div>
        <span class="text-xl font-bold tracking-wide block leading-none">Campus Virtual EVA</span>
        <span class="text-xs text-indigo-300">Plataforma de Aprendizaje y Gestión Académica</span>
      </div>
    </div>
    
    <!-- Selector de Rol -->
    <div class="flex items-center gap-4 text-sm font-medium">
      <div class="bg-indigo-800/80 p-1 rounded-lg border border-indigo-700 flex text-xs">
        <button id="btn-role-student" onclick="switchRole('estudiante')" class="px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow">
          Vista Estudiante
        </button>
        <button id="btn-role-teacher" onclick="switchRole('docente')" class="px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white flex items-center gap-1">
          <i data-lucide="lock" class="w-3 h-3"></i> Vista Docente
        </button>
      </div>
      <div class="hidden md:flex items-center gap-2 border-l border-indigo-700 pl-4">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs" id="user-avatar">
          E
        </div>
        <span id="user-name-display" class="text-sm">Estudiante</span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main id="main-content" class="flex-1 p-6 max-w-7xl mx-auto w-full">
    <!-- Carga dinámica -->
  </main>

  <script>
    let currentRole = 'estudiante'; 
    const ADMIN_PASSWORD = "Luis0316"; 
    
    // Cursos predeterminados con sus claves de matriculación obligatorias
    const defaultCursos = [
      { id: 'mat3', nombre: 'Matemática Superior', asignatura: 'Matemática', nivel: '3º BGU - Paralelo A', clave: 'MAT2026' },
      { id: 'fis2', nombre: 'Física General', asignatura: 'Física', nivel: '2º BGU - Paralelo B', clave: 'FIS2026' },
      { id: 'rob_2egb', nombre: 'Robótica Inicial - Mecanismos Básicos', asignatura: 'Robótica', nivel: '2º EGB', clave: 'ROB2EGB' },
      { id: 'rob_3egb', nombre: 'Robótica Educativa - Engranajes y Palancas', asignatura: 'Robótica', nivel: '3º EGB', clave: 'ROB3EGB' },
      { id: 'rob_4egb', nombre: 'Robótica Educativa - Circuitos Básicos', asignatura: 'Robótica', nivel: '4º EGB', clave: 'ROB4EGB' },
      { id: 'rob_5egb', nombre: 'Robótica y Autómatas I', asignatura: 'Robótica', nivel: '5º EGB', clave: 'ROB5EGB' },
      { id: 'rob_6egb', nombre: 'Robótica y Sensórica I', asignatura: 'Robótica', nivel: '6º EGB', clave: 'ROB6EGB' },
      { id: 'rob_7egb', nombre: 'Robótica y Sensórica II', asignatura: 'Robótica', nivel: '7º EGB', clave: 'ROB7EGB' },
      { id: 'rob_8egb', nombre: 'Programación de Bloques y Algoritmos', asignatura: 'Robótica', nivel: '8º EGB', clave: 'ROB8EGB' },
      { id: 'rob_9egb', nombre: 'Electrónica y Microcontroladores I', asignatura: 'Robótica', nivel: '9º EGB', clave: 'ROB9EGB' },
      { id: 'rob_10egb', nombre: 'Electrónica y Microcontroladores II', asignatura: 'Robótica', nivel: '10º EGB', clave: 'ROB10EGB' },
      { id: 'rob_1bgu', nombre: 'Robótica Aplicada - Micro:bit y Arduino', asignatura: 'Robótica', nivel: '1º BGU', clave: 'ROB1BGU' },
      { id: 'rob_2bgu', nombre: 'Robótica Avanzada - ESP32 y Domótica', asignatura: 'Robótica', nivel: '2º BGU', clave: 'ROB2BGU' },
      { id: 'rob_3bgu', nombre: 'Mecatrónica y Proyectos de Automatización', asignatura: 'Robótica', nivel: '3º BGU', clave: 'ROB3BGU' }
    ];

    const defaultActividades = [
      { id: 'act1', cursoId: 'mat3', tipo: 'Prueba', titulo: 'Evaluación: Límites e Indeterminaciones', detalle: '10 Preguntas de opción múltiple', tiempo: 30 },
      { id: 'act2', cursoId: 'rob_2bgu', tipo: 'Tarea', titulo: 'Deber 1: Diagrama de Conexiones ESP32', detalle: 'Subir esquemático en formato PDF con la guía de puertos asignada.', tiempo: 0 },
      { id: 'act3', cursoId: 'rob_5egb', tipo: 'Tarea', titulo: 'Deber 1: Diseño de Mecanismo de Transmisión', detalle: 'Adjuntar ficha de trabajo en PDF.', tiempo: 0 }
    ];

    const defaultEntregas = [
      { id: 'ent1', actividadId: 'act2', cursoId: 'rob_2bgu', estudiante: 'Benítez Carlos', archivoNombre: 'Deber_ESP32_Benitez.pdf', fecha: '2026-09-25 14:30', nota: 10.00 },
      { id: 'ent2', actividadId: 'act2', cursoId: 'rob_2bgu', estudiante: 'Alvarado Ana', archivoNombre: 'Tarea1_Alvarado.pdf', fecha: '2026-09-25 10:15', nota: 9.50 },
      { id: 'ent3', actividadId: 'act2', cursoId: 'rob_2bgu', estudiante: 'Zambrano David', archivoNombre: 'Esquema_ESP32_DZ.pdf', fecha: '2026-09-26 08:20', nota: 8.50 },
      { id: 'ent4', actividadId: 'act3', cursoId: 'rob_5egb', estudiante: 'Córdova María', archivoNombre: 'Ficha_Robótica_Cordova.pdf', fecha: '2026-09-26 11:00', nota: 9.00 }
    ];

    // Cargar datos de localStorage
    let db = {
      cursos: JSON.parse(localStorage.getItem('eva_cursos')) || defaultCursos,
      actividades: JSON.parse(localStorage.getItem('eva_actividades')) || defaultActividades,
      entregas: JSON.parse(localStorage.getItem('eva_entregas')) || defaultEntregas
    };

    function saveData() {
      localStorage.setItem('eva_cursos', JSON.stringify(db.cursos));
      localStorage.setItem('eva_actividades', JSON.stringify(db.actividades));
      localStorage.setItem('eva_entregas', JSON.stringify(db.entregas));
    }

    function switchRole(role) {
      if (role === 'docente') {
        const passInput = prompt("Acceso Restringido para el Docente.\n\nIngresa la contraseña de administrador:");
        if (passInput === null) return;
        if (passInput !== ADMIN_PASSWORD) {
          alert("Contraseña incorrecta. Acceso denegado.");
          return;
        }
      }

      currentRole = role;
      const btnStudent = document.getElementById('btn-role-student');
      const btnTeacher = document.getElementById('btn-role-teacher');
      const avatar = document.getElementById('user-avatar');
      const name = document.getElementById('user-name-display');

      if (role === 'estudiante') {
        btnStudent.className = "px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow";
        btnTeacher.className = "px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white flex items-center gap-1";
        avatar.innerText = "E";
        name.innerText = "Estudiante";
        renderEstudianteView();
      } else {
        btnTeacher.className = "px-3 py-1.5 rounded-md font-semibold transition-all bg-indigo-600 text-white shadow flex items-center gap-1";
        btnStudent.className = "px-3 py-1.5 rounded-md font-semibold transition-all text-indigo-200 hover:text-white";
        avatar.innerText = "D";
        name.innerText = "Docente Administrador";
        renderDocenteView();
      }
      lucide.createIcons();
    }

    // ----------------------------------------------------
    // ACCESO RESTRINGIDO POR CONTRASEÑA
    // ----------------------------------------------------
    function accessCourse(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      
      // Si el docente está activo, ingresa directamente sin validar contraseña
      if (currentRole === 'docente') {
        openCourse(cursoId);
        return;
      }

      // Validación para Estudiantes
      const userKey = prompt(`🔒 CURSO CON ACCESO RESTRINGIDO\n\nAsignatura: ${curso.nombre} (${curso.nivel})\n\nPor favor, ingresa la clave del curso proporcionada por tu docente:`);

      if (userKey === null) return; // Canceló el prompt

      if (userKey.trim() === curso.clave) {
        openCourse(cursoId);
      } else {
        alert("❌ Clave incorrecta. No tienes permiso para acceder a este curso o enviar deberes en él.");
      }
    }

    // ----------------------------------------------------
    // VISTA ESTUDIANTE
    // ----------------------------------------------------
    function renderEstudianteView() {
      const cursosCards = db.cursos.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all flex flex-col">
          <div class="bg-indigo-600 h-2"></div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${c.asignatura}</span>
                <span class="text-xs font-semibold text-slate-400">${c.nivel}</span>
              </div>
              <h3 class="text-base font-bold text-slate-900 mt-1">${c.nombre}</h3>
              <p class="text-slate-500 text-xs mt-1.5">Requiere clave de matriculación para ingresar y subir archivos.</p>
            </div>
            
            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-500"></i> Protegido
              </span>
              <button onclick="accessCourse('${c.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
                <i data-lucide="key" class="w-3.5 h-3.5"></i> Ingresar al Curso
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="mb-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-200 pb-5">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Catálogo de Cursos y Asignaturas</h1>
            <p class="text-slate-500 text-sm">Selecciona tu materia e ingresa tu clave para enviar tus deberes en formato PDF.</p>
          </div>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200 self-start">
            <i data-lucide="shield-check" class="w-4 h-4 text-indigo-600"></i> Acceso Seguro Activo
          </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${cursosCards}
        </div>
      `;
    }

    // ----------------------------------------------------
    // DENTRO DEL CURSO DESBLOQUEADO
    // ----------------------------------------------------
    function openCourse(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      const acts = db.actividades.filter(a => a.cursoId === cursoId);

      const actsHTML = acts.length > 0 ? acts.map(a => {
        const entregasActividad = db.entregas.filter(e => e.actividadId === a.id);

        return `
          <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-5 flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-indigo-100/80 pb-3">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded ${a.tipo === 'Prueba' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
                    ${a.tipo}
                  </span>
                  ${a.tiempo > 0 ? `<span class="text-xs text-slate-500 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${a.tiempo} min</span>` : ''}
                </div>
                <h4 class="font-bold text-indigo-950 text-base">${a.titulo}</h4>
                <p class="text-xs text-slate-600 mt-0.5">${a.detalle}</p>
              </div>
            </div>

            ${a.tipo === 'Tarea' ? `
              <!-- Formulario de Subida PDF -->
              <div class="bg-white p-4 rounded-xl border border-indigo-200 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                  <span class="text-xs font-bold text-indigo-900 flex items-center gap-1.5">
                    <i data-lucide="upload-cloud" class="w-4 h-4 text-indigo-600"></i> Entrega de Tarea (Formato PDF)
                  </span>
                  <span class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2 py-0.5 rounded">Curso Verificado</span>
                </div>

                <form onsubmit="submitHomework(event, '${a.id}', '${curso.id}')" class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Apellidos y Nombres del Estudiante:</label>
                    <input type="text" id="student-name-${a.id}" placeholder="Ej: Pérez Juan" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Seleccionar Documento PDF:</label>
                    <div class="relative border-2 border-dashed border-indigo-200 hover:border-indigo-400 bg-indigo-50/30 rounded-lg p-3 text-center transition-colors">
                      <input type="file" id="student-file-${a.id}" accept=".pdf" required onchange="handleFileSelect('${a.id}')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                      <div class="flex flex-col items-center justify-center gap-1">
                        <i data-lucide="file-up" class="w-6 h-6 text-indigo-500"></i>
                        <span id="file-label-${a.id}" class="text-xs font-medium text-slate-600">Haz clic aquí para adjuntar tu archivo PDF</span>
                      </div>
                    </div>
                  </div>

                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i> Subir y Registrar Tarea
                  </button>
                </form>

                <!-- Tareas ya enviadas -->
                ${entregasActividad.length > 0 ? `
                  <div class="mt-4 pt-3 border-t border-slate-100">
                    <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-2">Entregas enviadas en este curso:</span>
                    <div class="space-y-1.5">
                      ${entregasActividad.map(e => `
                        <div class="flex items-center justify-between text-xs bg-slate-50 p-2 rounded-lg border border-slate-200">
                          <span class="font-medium text-slate-800">${e.estudiante}</span>
                          <span class="text-rose-700 font-semibold flex items-center gap-1">
                            <i data-lucide="file-text" class="w-3 h-3"></i> ${e.archivoNombre}
                          </span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            ` : `
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs text-slate-600">
                Esta actividad es una evaluación en línea. Haz clic en rendir para comenzar.
              </div>
            `}
          </div>
        `;
      }).join('') : '<p class="text-slate-500 text-xs italic">No hay tareas o evaluaciones asignadas en este momento.</p>';

      const teacherControls = currentRole === 'docente' ? `
        <div class="bg-amber-50/70 border border-amber-200 rounded-xl p-4 mb-6">
          <h3 class="font-bold text-amber-900 text-xs mb-3 flex items-center gap-1.5 uppercase tracking-wide">
            <i data-lucide="plus-circle" class="w-4 h-4 text-amber-600"></i> Publicar Nueva Tarea o Prueba en este Curso
          </h3>
          <form onsubmit="addActivity(event, '${curso.id}')" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Tipo</label>
              <select id="new-act-type" class="w-full px-2.5 py-1.5 border rounded-lg text-xs bg-white outline-none focus:ring-1 focus:ring-amber-500">
                <option value="Tarea">Tarea (Requiere PDF)</option>
                <option value="Prueba">Prueba / Examen</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Título de la Actividad</label>
              <input type="text" id="new-act-title" placeholder="Ej: Deber 2: Mecanismos Serie" required class="w-full px-2.5 py-1.5 border rounded-lg text-xs bg-white outline-none focus:ring-1 focus:ring-amber-500">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Instrucciones</label>
              <input type="text" id="new-act-detail" placeholder="Ej: Subir reporte en formato PDF" required class="w-full px-2.5 py-1.5 border rounded-lg text-xs bg-white outline-none focus:ring-1 focus:ring-amber-500">
            </div>
            <div class="flex items-end">
              <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs py-2 px-3 rounded-lg transition-colors flex items-center justify-center gap-1 shadow-sm">
                <i data-lucide="save" class="w-3.5 h-3.5"></i> Publicar
              </button>
            </div>
          </form>
        </div>
      ` : '';

      document.getElementById('main-content').innerHTML = `
        <button onclick="${currentRole === 'docente' ? 'renderDocenteView()' : 'renderEstudianteView()'}; lucide.createIcons();" class="mb-4 flex items-center gap-1.5 text-xs text-indigo-600 font-semibold hover:text-indigo-800 transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Salir del curso y volver al catálogo
        </button>

        <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm mb-6">
          <div class="border-b border-slate-100 pb-4 mb-6 flex justify-between items-start">
            <div>
              <span class="text-xs font-bold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${curso.asignatura}</span>
              <h2 class="text-2xl font-bold text-slate-900 mt-2">${curso.nombre}</h2>
              <p class="text-slate-500 text-sm">${curso.nivel}</p>
            </div>
            <span class="font-mono bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-md text-xs font-bold flex items-center gap-1">
              <i data-lucide="unlock" class="w-3.5 h-3.5 text-emerald-600"></i> Acceso Concedido
            </span>
          </div>

          ${teacherControls}

          <div>
            <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
              <i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i> Tareas y Evaluaciones de este Curso
            </h3>
            <div class="space-y-4">
              ${actsHTML}
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function handleFileSelect(actId) {
      const fileInput = document.getElementById(`student-file-${actId}`);
      const label = document.getElementById(`file-label-${actId}`);
      if (fileInput.files && fileInput.files[0]) {
        label.innerText = "📄 PDF Seleccionado: " + fileInput.files[0].name;
        label.classList.add("text-indigo-700", "font-bold");
      }
    }

    function submitHomework(event, actId, cursoId) {
      event.preventDefault();
      const studentName = document.getElementById(`student-name-${actId}`).value.trim();
      const fileInput = document.getElementById(`student-file-${actId}`);

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor selecciona un archivo PDF.");
        return;
      }

      const file = fileInput.files[0];

      db.entregas.push({
        id: 'ent_' + Date.now(),
        actividadId: actId,
        cursoId: cursoId,
        estudiante: studentName,
        archivoNombre: file.name,
        fecha: new Date().toISOString().replace('T', ' ').substring(0, 16),
        nota: 0.00
      });

      saveData();
      alert(`¡Éxito! Tarea de "${studentName}" registrada en este curso.`);
      openCourse(cursoId);
    }

    function addActivity(event, cursoId) {
      event.preventDefault();
      const type = document.getElementById('new-act-type').value;
      const title = document.getElementById('new-act-title').value.trim();
      const detail = document.getElementById('new-act-detail').value.trim();

      db.actividades.push({
        id: 'act_' + Date.now(),
        cursoId: cursoId,
        tipo: type,
        titulo: title,
        detalle: detail,
        tiempo: type === 'Prueba' ? 30 : 0
      });

      saveData();
      alert(`¡${type} publicada en el curso!`);
      openCourse(cursoId);
    }

    // ----------------------------------------------------
    // VISTA DOCENTE Y CENTRO DE RECEPCIÓN PDF CLASIFICADO
    // ----------------------------------------------------
    function renderDocenteView() {
      const cursosTableRows = db.cursos.map(c => `
        <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
          <td class="py-2.5 px-3 font-bold text-slate-900">${c.nombre}</td>
          <td class="py-2.5 px-3 text-slate-600">${c.nivel}</td>
          <td class="py-2.5 px-3 font-semibold text-indigo-600">${c.asignatura}</td>
          <td class="py-2.5 px-3">
            <span class="font-mono bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded text-xs font-bold inline-flex items-center gap-1">
              <i data-lucide="key" class="w-3 h-3 text-amber-600"></i> ${c.clave}
            </span>
          </td>
          <td class="py-2.5 px-3 flex items-center gap-2">
            <button onclick="openCourse('${c.id}')" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 font-semibold px-2 py-1 rounded-lg transition-colors flex items-center gap-1">
              <i data-lucide="edit-3" class="w-3 h-3"></i> Tareas
            </button>
            <button onclick="changeKey('${c.id}')" class="text-xs bg-slate-900 hover:bg-slate-800 text-white font-medium px-2 py-1 rounded-lg transition-colors">
              Cambiar Clave
            </button>
            <button onclick="deleteCourse('${c.id}')" class="text-xs bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 font-semibold px-2 py-1 rounded-lg transition-colors" title="Eliminar Curso">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </td>
        </tr>
      `).join('');

      let entregasClasificadasHTML = '';

      db.cursos.forEach(curso => {
        let entregasCurso = db.entregas.filter(e => e.cursoId === curso.id);

        if (entregasCurso.length > 0) {
          entregasCurso.sort((a, b) => a.estudiante.localeCompare(b.estudiante));

          const filasEntregas = entregasCurso.map(e => {
            const act = db.actividades.find(a => a.id === e.actividadId);
            return `
              <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                <td class="py-2.5 px-4 font-bold text-slate-900 flex items-center gap-2">
                  <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-[10px] font-black">
                    ${e.estudiante.charAt(0)}
                  </div>
                  ${e.estudiante}
                </td>
                <td class="py-2.5 px-4 text-slate-700 font-medium">${act ? act.titulo : 'Tarea'}</td>
                <td class="py-2.5 px-4">
                  <a href="#" onclick="alert('Abriendo vista previa del PDF subido: ${e.archivoNombre}'); return false;" class="inline-flex items-center gap-1.5 text-xs font-bold text-rose-700 bg-rose-50 border border-rose-200 px-2.5 py-1 rounded-md hover:bg-rose-100 transition-colors">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-rose-600"></i> ${e.archivoNombre}
                  </a>
                </td>
                <td class="py-2.5 px-4 text-slate-500 text-xs">${e.fecha}</td>
                <td class="py-2.5 px-4">
                  <button onclick="gradeAssignment('${e.id}')" class="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 px-2.5 py-1 rounded-md font-bold transition-colors">
                    ${e.nota > 0 ? e.nota.toFixed(2) + ' / 10' : 'Calificar'}
                  </button>
                </td>
              </tr>
            `;
          }).join('');

          entregasClasificadasHTML += `
            <div class="mb-6 bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
              <div class="bg-indigo-900 text-white px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold bg-indigo-700 text-indigo-200 px-2.5 py-0.5 rounded-md uppercase tracking-wider">${curso.asignatura}</span>
                  <h3 class="font-bold text-sm">${curso.nombre} - <span class="text-indigo-300 font-normal">${curso.nivel}</span></h3>
                </div>
                <span class="text-xs bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-full font-semibold">
                  ${entregasCurso.length} Tareas Recibidas (Orden Alfabético A-Z)
                </span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-100/80 text-slate-600 uppercase text-[10px] font-bold">
                      <th class="py-2.5 px-4">Estudiante (Nombre y Apellido)</th>
                      <th class="py-2.5 px-4">Tarea Asignada</th>
                      <th class="py-2.5 px-4">Archivo Documento PDF</th>
                      <th class="py-2.5 px-4">Fecha de Envío</th>
                      <th class="py-2.5 px-4">Calificación</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filasEntregas}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }
      });

      if (entregasClasificadasHTML === '') {
        entregasClasificadasHTML = `
          <div class="p-8 text-center bg-white rounded-xl border border-slate-200">
            <i data-lucide="folder-open" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
            <p class="text-slate-500 text-xs italic">Aún no hay archivos PDF enviados por los estudiantes.</p>
          </div>
        `;
      }

      document.getElementById('main-content').innerHTML = `
        <div class="mb-6 border-b border-slate-200 pb-5 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Panel Docente Administrador</h1>
            <p class="text-slate-500 text-sm">Gestión de oferta académica y centro de recepción de tareas en formato PDF.</p>
          </div>
          <button onclick="switchRole('estudiante')" class="bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 text-xs font-bold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 self-start">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Salir de Vista Docente
          </button>
        </div>

        <!-- Módulo de Creación de Cursos -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-8">
          <h2 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i> Registrar Nuevo Curso / Asignatura
          </h2>
          <form onsubmit="addNewCourse(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Nombre del Curso</label>
              <input type="text" id="new-course-name" placeholder="Ej: Robótica Educativa" required class="w-full px-3 py-1.5 border rounded-lg text-xs bg-slate-50 outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Asignatura</label>
              <input type="text" id="new-course-subject" placeholder="Ej: Robótica" required class="w-full px-3 py-1.5 border rounded-lg text-xs bg-slate-50 outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Nivel / Subnivel / Año</label>
              <input type="text" id="new-course-level" placeholder="Ej: 5º EGB" required class="w-full px-3 py-1.5 border rounded-lg text-xs bg-slate-50 outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Clave de Matriculación</label>
              <input type="text" id="new-course-key" placeholder="Ej: ROB5EGB" required class="w-full px-3 py-1.5 border rounded-lg text-xs bg-slate-50 outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div class="flex items-end">
              <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2 px-3 rounded-lg transition-colors flex items-center justify-center gap-1 shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i> Guardar Curso
              </button>
            </div>
          </form>
        </div>

        <!-- MÓDULO PRINCIPAL: Recepción y Clasificación de Tareas PDF -->
        <div class="mb-8">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="folder-archive" class="w-5 h-5 text-indigo-600"></i> Centro de Recepción PDF Clasificado (Curso, Año y A-Z)
            </h2>
          </div>
          ${entregasClasificadasHTML}
        </div>

        <!-- Tabla: Catálogo de Cursos -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
          <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
            <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
              <i data-lucide="layout-grid" class="w-4 h-4 text-indigo-600"></i> Catálogo de Asignaturas y Claves (${db.cursos.length})
            </h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-100/70 text-slate-600 uppercase text-[10px] font-bold">
                  <th class="py-2.5 px-3">Curso</th>
                  <th class="py-2.5 px-3">Nivel / Año</th>
                  <th class="py-2.5 px-3">Asignatura</th>
                  <th class="py-2.5 px-3">Clave Requerida</th>
                  <th class="py-2.5 px-3">Acciones</th>
                </tr>
              </thead>
              <tbody>
                ${cursosTableRows}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function gradeAssignment(entregaId) {
      const entrega = db.entregas.find(e => e.id === entregaId);
      const val = prompt(`Ingresa la nota sobre 10 para ${entrega.estudiante}:`, entrega.nota || 10);
      if (val !== null && !isNaN(val)) {
        entrega.nota = parseFloat(val);
        saveData();
        alert(`Nota de ${entrega.estudiante} guardada: ${entrega.nota.toFixed(2)}/10`);
        renderDocenteView();
        lucide.createIcons();
      }
    }

    function addNewCourse(event) {
      event.preventDefault();
      const name = document.getElementById('new-course-name').value.trim();
      const subject = document.getElementById('new-course-subject').value.trim();
      const level = document.getElementById('new-course-level').value.trim();
      const key = document.getElementById('new-course-key').value.trim();

      db.cursos.push({
        id: 'c_' + Date.now(),
        nombre: name,
        asignatura: subject,
        nivel: level,
        clave: key
      });

      saveData();
      alert(`Curso "${name}" publicado exitosamente con clave "${key}".`);
      renderDocenteView();
      lucide.createIcons();
    }

    function deleteCourse(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      if (confirm(`¿Deseas eliminar el curso "${curso.nombre}"?`)) {
        db.cursos = db.cursos.filter(c => c.id !== cursoId);
        db.actividades = db.actividades.filter(a => a.cursoId !== cursoId);
        db.entregas = db.entregas.filter(e => e.cursoId !== cursoId);
        saveData();
        renderDocenteView();
        lucide.createIcons();
      }
    }

    function changeKey(cursoId) {
      const curso = db.cursos.find(c => c.id === cursoId);
      const newKey = prompt(`Nueva clave de acceso para "${curso.nombre}":`, curso.clave);
      if (newKey && newKey.trim() !== '') {
        curso.clave = newKey.trim();
        saveData();
        renderDocenteView();
        lucide.createIcons();
      }
    }

    window.onload = () => {
      renderEstudianteView();
      lucide.createIcons();
    };
  </script>
</body>
</html>
